# The local stack: object storage, an Iceberg catalog, Kafka and Redis.
#
#   docker compose -f docker/docker-compose.yml up -d
#   make stack-iceberg      # the lakehouse on Iceberg
#   make stack-kafka        # the streaming path on real Kafka
#
# Nothing here is cloud-specific. The same Iceberg tables open on S3, GCS or
# ADLS by changing the endpoint; the same topics exist on MSK, Confluent Cloud
# or Redpanda by changing bootstrap.servers.
#
# Kafka runs in KRaft mode - no ZooKeeper - as a single broker, which is right
# for a laptop and wrong for anything else. Production runs Strimzi on
# Kubernetes with the partition counts in src/retailgr/streaming/schemas.py.

name: retailgr

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: retailgr-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the warehouse bucket once MinIO is up, then exits.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: retailgr-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb --ignore-existing local/retailgr &&
      echo 'bucket retailgr ready'
      "

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.9.1
    container_name: retailgr-iceberg-rest
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://retailgr/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}

  kafka:
    image: apache/kafka:3.9.0
    container_name: retailgr-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # Advertise the host port so producers outside Docker can reach it.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # The topics this project uses are created by the app, from
      # TOPIC_SPECS, so their partition counts and cleanup policies live in
      # code rather than being guessed by the broker.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: retailgr-local-cluster
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD",
          "/opt/kafka/bin/kafka-broker-api-versions.sh",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 20

  # The Avro contract in src/retailgr/streaming/schemas.py is registered here
  # under <topic>-value when the Kafka backend uses the Avro serializer.
  schema-registry:
    image: apicurio/apicurio-registry-mem:2.6.5.Final
    container_name: retailgr-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      QUARKUS_PROFILE: prod

  redis:
    image: redis:7.4-alpine
    container_name: retailgr-redis
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  minio-data:
  kafka-data:
